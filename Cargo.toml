[package]
name = "openidea-plugin-xirf-key-promoter-x"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "OpenIDEA port of Key Promoter X — learn keyboard shortcuts from mouse actions."
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.50" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
